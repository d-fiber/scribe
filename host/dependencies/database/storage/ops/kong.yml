services:
  - name: storage-v1
    _comment: "Storage: /storage/v1/* -> http://storage:5000/ — LECTURE SEULE. Objets publics (/object/public/*) lisibles sans aucune condition ; tout le reste (bucket privé) exige un JWT admin, et le VPN est imposé en amont par Caddy qui ne route le privé que sur ADMIN_DOMAIN. Aucun upload ni suppression ne passe par ici : ils vont tous aux edge functions, qui portent la validation (identité, extension, taille, chemin)."
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
        config:
          {{storage_cors_origins}}
      - name: pre-function
        config:
          access:
            - |
              -- Lecture seule : aucune écriture ne doit passer par la passerelle.
              -- 404 plutôt que 405, pour ne pas révéler que la route existe.
              local method = kong.request.get_method()
              if method ~= "GET" and method ~= "HEAD" then
                return kong.response.exit(404, '{"message":"Not found"}', {["Content-Type"] = "application/json"})
              end

              -- Objets publics : lisibles sans aucune condition, y compris sans
              -- jeton. C'est ce qui rend l'URL utilisable par un <img>, un mail
              -- ou un CDN. Le bucket app_bucket est public côté storage, la RLS
              -- ne s'applique pas à ce chemin.
              local path = kong.request.get_path()
              if path:find("/object/public/", 1, true) then
                return
              end

              -- Tout le reste vise le bucket privé : jeton obligatoire.
              local auth = kong.request.get_header("authorization")
              local token = auth and auth:match("^[Bb]earer%s+(.+)$")

              if not token then
                return kong.response.exit(401, '{"message":"Unauthorized"}', {["Content-Type"] = "application/json"})
              end

              local payload_b64 = token:match("^[^.]+%.([^.]+)%.")
              if not payload_b64 then
                return kong.response.exit(401, '{"message":"Unauthorized"}', {["Content-Type"] = "application/json"})
              end

              local b64 = payload_b64:gsub('%-', '+'):gsub('_', '/')
              local pad = (4 - #b64 % 4) % 4
              b64 = b64 .. string.rep('=', pad)
              local decoded = ngx.decode_base64(b64)

              if not decoded then
                return kong.response.exit(401, '{"message":"Unauthorized"}', {["Content-Type"] = "application/json"})
              end

              -- Extract role and sub via pattern matching (cjson not allowed in sandbox)
              local role = decoded:match('"role"%s*:%s*"([^"]*)"')
              local sub  = decoded:match('"sub"%s*:%s*"([^"]*)"')

              -- service_role bypasses all restrictions (Studio / internal calls)
              if role == "service_role" then
                return
              end

              if not sub or sub == '' then
                return kong.response.exit(401, '{"message":"Unauthorized"}', {["Content-Type"] = "application/json"})
              end

              -- Privé = admin uniquement. La RLS le vérifie aussi côté base
              -- (storage_select_admin_bucket) et Caddy impose le VPN en amont :
              -- trois barrières indépendantes, aucune ne suffit seule.
              if role ~= "admin" then
                return kong.response.exit(404, '{"message":"Not found"}', {["Content-Type"] = "application/json"})
              end
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
