services:
  opensearch:
    cpu_shares: 512
    deploy:
      resources:
        limits:
          cpus: "{{opensearch_cpu_limit}}"
          memory: "{{opensearch_mem_limit}}"
        reservations:
          memory: "{{opensearch_mem_res}}"
  opensearch-setup:
    deploy:
      resources:
        limits:
          memory: "{{opensearch_setup_mem_limit}}"
