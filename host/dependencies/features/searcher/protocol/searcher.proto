syntax = "proto3";

package scribe.clients.searcher.v1;

import "scribe/protocol/common.proto";

message Document {
  string id = 1;
  scribe.v1.Json source = 2;
}

message AddRequest {
  string entity = 1;
  repeated Document documents = 2;
  bool refresh = 3;
}

message AddResult {
  uint32 indexed = 1;
  scribe.v1.Failure error = 2;
}

message DeleteRequest {
  string entity = 1;
  repeated string ids = 2;
}

message DeleteResult {
  uint32 deleted = 1;
  scribe.v1.Failure error = 2;
}

message GeoDistance {
  double lat = 1;
  double lng = 2;
  double radius_meters = 3;
}

message Sort {
  string field = 1;
  bool descending = 2;
  GeoDistance geo = 3;
}

message SearchRequest {
  string entity = 1;
  scribe.v1.Json query = 2;
  repeated string fields = 3;
  repeated Sort sort = 4;
  uint32 limit = 5;
  uint32 offset = 6;
  string cache_key = 7;
}

message SearchHit {
  string id = 1;
  double score = 2;
  scribe.v1.Json source = 3;
}

message SearchResult {
  repeated SearchHit hits = 1;
  uint64 total = 2;
  scribe.v1.Failure error = 3;
}

service Searcher {
  rpc Add(AddRequest) returns (AddResult);
  rpc Delete(DeleteRequest) returns (DeleteResult);
  rpc Search(SearchRequest) returns (SearchResult);
}
