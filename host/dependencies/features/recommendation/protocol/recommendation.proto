syntax = "proto3";

package scribe.clients.recommendation.v1;

import "scribe/protocol/common.proto";

message User {
  string id = 1;
  scribe.v1.Json labels = 2;
  string comment = 3;
}

message Item {
  string id = 1;
  scribe.v1.Json labels = 2;
  string comment = 3;
  repeated string categories = 4;
  bool is_hidden = 5;
  string timestamp = 6;
}

message Feedback {
  string type = 1;
  string user_id = 2;
  string item_id = 3;
  double value = 4;
  string timestamp = 5;
}

message UpsertUserRequest {
  User user = 1;
}

message UpsertItemRequest {
  Item item = 1;
}

message DeleteUserRequest {
  string user_id = 1;
}

message DeleteItemRequest {
  string item_id = 1;
}

message InsertFeedbackRequest {
  repeated Feedback feedback = 1;
}

message RecommendRequest {
  string user_id = 1;
  uint32 count = 2;
  string category = 3;
  uint32 offset = 4;
}

message RecommendResult {
  repeated string item_ids = 1;
  scribe.v1.Failure error = 2;
}

message VoidResult {
  scribe.v1.Failure error = 1;
}

service Recommendation {
  rpc UpsertUser(UpsertUserRequest) returns (VoidResult);
  rpc UpsertItem(UpsertItemRequest) returns (VoidResult);
  rpc DeleteUser(DeleteUserRequest) returns (VoidResult);
  rpc DeleteItem(DeleteItemRequest) returns (VoidResult);
  rpc InsertFeedback(InsertFeedbackRequest) returns (VoidResult);
  rpc Recommend(RecommendRequest) returns (RecommendResult);
}
