syntax = "proto3";

package scribe.clients.messagings.v1;

import "scribe/protocol/common.proto";

message Recipient {
  string address = 1;
  string name = 2;
}

message MailRequest {
  string account = 1;
  repeated Recipient to = 2;
  repeated Recipient cc = 3;
  repeated Recipient bcc = 4;
  string subject = 5;
  string template = 6;
  scribe.v1.Json template_data = 7;
  string html = 8;
  string text = 9;
}

message MailResult {
  string message_id = 1;
  scribe.v1.Failure error = 2;
}

message SmsRequest {
  string to = 1;
  string template = 2;
  scribe.v1.Json template_data = 3;
  string body = 4;
}

message SmsResult {
  string message_id = 1;
  scribe.v1.Failure error = 2;
}

message PushRequest {
  repeated string tokens = 1;
  repeated string user_ids = 2;
  string template = 3;
  scribe.v1.Json template_data = 4;
  string title = 5;
  string body = 6;
  scribe.v1.Json data = 7;
}

message PushResult {
  uint32 sent = 1;
  uint32 failed = 2;
  scribe.v1.Failure error = 3;
}

service Messagings {
  rpc SendMail(MailRequest) returns (MailResult);
  rpc SendSms(SmsRequest) returns (SmsResult);
  rpc SendPush(PushRequest) returns (PushResult);
}
