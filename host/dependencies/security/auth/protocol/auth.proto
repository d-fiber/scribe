syntax = "proto3";

package scribe.clients.auth.v1;

import "scribe/protocol/common.proto";
import "scribe/protocol/invocation.proto";

message AccountRequest {
  string user_id = 1;
  string email = 2;
}

message Account {
  string id = 1;
  string email = 2;
  string phone = 3;
  bool email_confirmed = 4;
  bool phone_confirmed = 5;
  scribe.v1.Json app_metadata = 6;
  scribe.v1.Json user_metadata = 7;
  int64 created_at = 8;
}

message AccountResult {
  Account account = 1;
  scribe.v1.Failure error = 2;
}

message UpdateAccountRequest {
  string user_id = 1;
  string email = 2;
  string phone = 3;
  scribe.v1.Json user_metadata = 4;
}

message DeleteAccountRequest {
  string user_id = 1;
  bool soft = 2;
}

message DeleteAccountResult {
  scribe.v1.Failure error = 1;
}

message SessionRequest {
  string session_id = 1;
  string user_id = 2;
}

message SessionSummary {
  string id = 1;
  string user_id = 2;
  int64 created_at = 3;
  int64 expires_at = 4;
}

message SessionListResult {
  repeated SessionSummary sessions = 1;
  scribe.v1.Failure error = 2;
}

message SignOutRequest {
  string user_id = 1;
  string session_id = 2;
  bool global = 3;
}

message SignOutResult {
  scribe.v1.Failure error = 1;
}

message ValidateRequest {
  string password = 1;
  string email = 2;
  string phone = 3;
}

message ValidateResult {
  bool valid = 1;
  repeated string violations = 2;
}

service Auth {
  rpc GetAccount(AccountRequest) returns (AccountResult);
  rpc UpdateAccount(UpdateAccountRequest) returns (AccountResult);
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResult);
  rpc ListSessions(SessionRequest) returns (SessionListResult);
  rpc SignOut(SignOutRequest) returns (SignOutResult);
  rpc Validate(ValidateRequest) returns (ValidateResult);
}
