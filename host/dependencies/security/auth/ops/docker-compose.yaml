services:
  auth:
    container_name: "supabase-auth"
    image: "supabase/gotrue:v2.186.0"
    restart: "unless-stopped"
    environment:
      GOTRUE_API_HOST: "0.0.0.0"
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${ADMIN_URL}
      GOTRUE_DB_DRIVER: "postgres"
      GOTRUE_DB_DATABASE_URL: "postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres"
      GOTRUE_DB_CONN_MAX_POOL_SIZE: "20"
      GOTRUE_SITE_URL: ${APP_URL}
      GOTRUE_JWT_ADMIN_ROLES: "service_role"
      GOTRUE_JWT_AUD: "authenticated"
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_SMTP_MAX_FREQUENCY: "90s"
      GOTRUE_SMTP_ADMIN_EMAIL: ${GOTRUE_SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${GOTRUE_SMTP_HOST}
      GOTRUE_SMTP_PORT: ${GOTRUE_SMTP_PORT}
      GOTRUE_SMTP_USER: ${GOTRUE_SMTP_USER}
      GOTRUE_SMTP_PASS: ${GOTRUE_SMTP_PASS}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_SMTP_SENDER_NAME: "{{app_name}}"
      GOTRUE_HOOK_SEND_EMAIL_ENABLED: "true"
      GOTRUE_HOOK_SEND_EMAIL_URI: "${API_INTERNAL_URL:-http://api:3000}/gotrue/email"
      GOTRUE_HOOK_SEND_EMAIL_SECRETS: ${HOOK_SEND_EMAIL_SECRETS}
      GOTRUE_HOOK_SEND_SMS_ENABLED: "true"
      GOTRUE_HOOK_SEND_SMS_URI: "${API_INTERNAL_URL:-http://api:3000}/gotrue/sms"
      GOTRUE_HOOK_SEND_SMS_SECRETS: ${HOOK_SEND_SMS_SECRETS}
      GOTRUE_HOOK_PASSWORD_VERIFICATION_ATTEMPT_ENABLED: "false"
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_MFA_PHONE_ENROLL_ENABLED: "false"
      GOTRUE_MFA_PHONE_VERIFY_ENABLED: "false"
      GOTRUE_MFA_MAX_ENROLLED_FACTORS: "2"
      GOTRUE_HOOK_MFA_VERIFICATION_ATTEMPT_ENABLED: "false"
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: "true"
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: "${API_INTERNAL_URL:-http://api:3000}/gotrue/custom-access-token"
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_SECRETS: ${HOOK_CUSTOM_ACCESS_TOKEN_SECRETS}
      GOTRUE_EXTERNAL_PHONE_ENABLED: "true"
      GOTRUE_SMS_PROVIDER: "twilio"
      GOTRUE_SMS_TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      GOTRUE_SMS_TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      GOTRUE_SMS_TWILIO_MESSAGE_SERVICE_SID: ${TWILIO_MESSAGE_SERVICE_SID}
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "true"
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOTRUE_EXTERNAL_GOOGLE_ADDITIONAL_CLIENT_IDS: ${GOOGLE_ADDITIONAL_CLIENT_IDS}
      GOTRUE_EXTERNAL_APPLE_ENABLED: "true"
      GOTRUE_EXTERNAL_APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      GOTRUE_EXTERNAL_APPLE_SECRET: ${APPLE_CLIENT_SECRET}
      GOTRUE_EXTERNAL_APPLE_ADDITIONAL_CLIENT_IDS: ${APPLE_ADDITIONAL_CLIENT_IDS}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9999/health",
        ]
      interval: "5s"
      timeout: "5s"
      retries: 3
      start_period: "10s"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: "service_healthy"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  db-dev-confirm:
    container_name: "supabase-db-dev-confirm"
    image: "postgres:15-alpine"
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command:
      [
        "psql",
        "-h",
        "db",
        "-U",
        "postgres",
        "-d",
        "postgres",
        "-c",
        "UPDATE auth.users SET email_confirmed_at = now() WHERE email LIKE '%@{{app_name_snake}}.dev' AND email_confirmed_at IS NULL;",
      ]
    depends_on:
      auth:
        condition: "service_healthy"
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
