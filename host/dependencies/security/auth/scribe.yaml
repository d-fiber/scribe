name: auth
title: "Identity: sessions, OTP, OAuth, GoTrue webhooks."
optional: false

requires: []

ops:
  services:
    - auth
    - db-dev-confirm
  profile: null
  gateway: []
  env:
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - GOOGLE_ADDITIONAL_CLIENT_IDS
    - APPLE_CLIENT_ID
    - APPLE_CLIENT_SECRET
    - APPLE_ADDITIONAL_CLIENT_IDS
    - GOTRUE_SMTP_HOST
    - GOTRUE_SMTP_PORT
    - GOTRUE_SMTP_USER
    - GOTRUE_SMTP_PASS
    - GOTRUE_SMTP_ADMIN_EMAIL
    - TWILIO_ACCOUNT_SID
    - TWILIO_AUTH_TOKEN
    - TWILIO_MESSAGE_SERVICE_SID
    - HOOK_CUSTOM_ACCESS_TOKEN_SECRETS
    - HOOK_SEND_EMAIL_SECRETS
    - HOOK_SEND_SMS_SECRETS

sql: db/init
protocol: protocol/auth.proto
export: ./security/auth

routes: []
