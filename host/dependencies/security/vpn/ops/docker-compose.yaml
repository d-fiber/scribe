services:
  vpn-admins:
    profiles: ["ops"]
    container_name: "vpn-admins"
    image: "ghcr.io/wg-easy/wg-easy:13"
    restart: "unless-stopped"
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - "vpn-admins-data:/etc/wireguard"
    environment:
      LANG: "en"
      WG_HOST: ${VPN_DOMAIN}
      PORT: "51821"
      WG_PORT: "51820"
      WG_DEFAULT_DNS: "1.1.1.1, 8.8.8.8"
      WG_DEFAULT_ADDRESS: "10.8.0.x"
      WG_ALLOWED_IPS: "10.8.0.0/24, 51.210.46.163/32"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:51821/',r=>r.statusCode<500?process.exit(0):process.exit(1)).on('error',()=>process.exit(1))",
        ]
      interval: "10s"
      timeout: "5s"
      retries: 5
      start_period: "15s"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  vpn-admins-data: null
