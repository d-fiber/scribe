syntax = "proto3";

package scribe.clients.vpn.v1;

import "scribe/protocol/common.proto";

message Vpn {
  string id = 1;
  string name = 2;
  bool enabled = 3;
  int64 created_at = 4;
  int64 last_handshake_at = 5;
}

message VpnResult {
  Vpn vpn = 1;
  scribe.v1.Failure error = 2;
}

message VoidResult {
  scribe.v1.Failure error = 1;
}

message VpnRef {
  string vpn_id = 1;
}

message OwnerRef {
  string name = 1;
}

message CreateRequest {
  string name = 1;
}

message RenameRequest {
  string vpn_id = 1;
  string name = 2;
}

message PaginationRequest {
  uint32 offset = 1;
  uint32 size = 2;
}

message PaginationResult {
  repeated Vpn vpns = 1;
  uint64 total = 2;
  scribe.v1.Failure error = 3;
}

message ConfigurationResult {
  string configuration = 1;
  scribe.v1.Failure error = 2;
}

message QrcodeResult {
  string qrcode = 1;
  scribe.v1.Failure error = 2;
}

service VpnAdmin {
  rpc Get(VpnRef) returns (VpnResult);
  rpc GetByOwner(OwnerRef) returns (VpnResult);
  rpc Create(CreateRequest) returns (VpnResult);
  rpc Delete(VpnRef) returns (VoidResult);
  rpc DeleteAll(OwnerRef) returns (VoidResult);
  rpc Enable(VpnRef) returns (VoidResult);
  rpc Disable(VpnRef) returns (VoidResult);
  rpc DisableAll(OwnerRef) returns (VoidResult);
  rpc Rename(RenameRequest) returns (VoidResult);
  rpc Pagination(PaginationRequest) returns (PaginationResult);
  rpc Configuration(VpnRef) returns (ConfigurationResult);
  rpc Qrcode(VpnRef) returns (QrcodeResult);
}
