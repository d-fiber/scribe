syntax = "proto3";

package scribe.v1;

import "scribe/protocol/common.proto";

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_DEBUG = 1;
  LOG_LEVEL_INFO = 2;
  LOG_LEVEL_WARN = 3;
  LOG_LEVEL_ERROR = 4;
}

message LogEntry {
  LogLevel level = 1;
  string action = 2;
  string actor_type = 3;
  string actor_id = 4;
  Json metadata = 5;
  int64 timestamp = 6;
  string trace_id = 7;
  string invocation_id = 8;
  string node = 9;
}

message LogBatch {
  repeated LogEntry entries = 1;
}

message LogAck {}

// Worker to host: what the project logged through the SDK, on its way to the
// host's shipper.
service Logging {
  rpc Ship(LogBatch) returns (LogAck);
}

message LogDelivery {
  string node = 1;
  repeated LogEntry entries = 2;
}

message LogDeliveryAck {}

// Host to worker: the entries a `_logs.ts` declared it would take.
//
// The reverse direction of Logging.Ship, and the reason both exist: the access
// log is produced where the exchange happens, which is the host, while the sink
// that decides what to do with it is project code, which runs in the worker.
service LogDispatch {
  rpc Handle(LogDelivery) returns (LogDeliveryAck);
}
