syntax = "proto3";

package scribe.v1;

import "scribe/protocol/common.proto";

message Rules {
  string role = 1;
  repeated string permissions = 2;
}

message Identity {
  string id = 1;
  string email = 2;
  Caller caller = 3;
  Rules rules = 4;
}

message Localization {
  string language = 1;
  string region = 2;
  string timezone = 3;
}

message Device {
  string device_id = 1;
  string client = 2;
  string os = 3;
  string model = 4;
  string app_version = 5;
  bool is_physical_device = 6;
  string device_category = 7;
  string notification_token = 8;
  string device_token = 9;
  Localization localization = 10;
  string theme_mode = 11;
  string binding = 12;
  int64 iat = 13;
  string nonce = 14;
}

message IpLocation {
  string city = 1;
  string country = 2;
}

message Coordinates {
  double lat = 1;
  double lng = 2;
}

message Request {
  Method method = 1;
  string path = 2;
  map<string, string> path_params = 3;
  map<string, string> query = 4;
  map<string, string> headers = 5;
  bytes body = 6;
  string ip = 7;
  string user_agent = 8;
  string session_id = 9;
}

message Invocation {
  string invocation_id = 1;
  string trace_id = 2;
  string route_id = 3;
  Request request = 4;
  Identity identity = 5;
  Device device = 6;
  IpLocation location = 7;
  string capability_token = 8;
}

message Reply {
  string invocation_id = 1;
  uint32 status = 2;
  map<string, string> headers = 3;
  bytes body = 4;
  Failure failure = 5;
}

service Worker {
  rpc Invoke(Invocation) returns (Reply);
}
