syntax = "proto3";

package scribe.v1;

message Time {
  int64 millis = 1;
}

message Size {
  int64 bytes = 1;
}

message Failure {
  string code = 1;
  string message = 2;
}

message Json {
  bytes value = 1;
}

enum Caller {
  CALLER_UNSPECIFIED = 0;
  CALLER_ANONYMOUS = 1;
  CALLER_USER = 2;
  CALLER_ADMIN = 3;
  CALLER_SERVICE = 4;
  CALLER_WEBHOOK = 5;
}

enum Method {
  METHOD_UNSPECIFIED = 0;
  METHOD_GET = 1;
  METHOD_POST = 2;
  METHOD_PUT = 3;
  METHOD_PATCH = 4;
  METHOD_DELETE = 5;
}

enum Need {
  NEED_UNSPECIFIED = 0;
  NEED_DEVICE = 1;
  NEED_LOCATION = 2;
}
