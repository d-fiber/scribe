name: release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Say what would be released without opening anything
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_PUSH_KEY }}
          persist-credentials: true

      - name: Refuse to release a version that was never tagged
        run: |
          set -eu
          version=$(python3 -c "import json;print(json.load(open('scribe.workspace.json'))['version'])")
          git fetch --tags origin

          if ! git rev-parse "v$version" >/dev/null 2>&1; then
            echo "dev says $version, and no v$version tag exists."
            echo ""
            echo "A version is tagged by the CI once it moves, so an untagged one means"
            echo "either the version has not been bumped or its checks never went green."
            exit 1
          fi
          echo "v$version is on $(git rev-parse --short "v$version^{commit}")"

      - name: Refuse to release when dev has nothing new
        run: |
          set -eu
          git fetch origin main:refs/remotes/origin/main
          if git diff --quiet origin/main..HEAD; then
            echo "dev and main are identical, there is nothing to release"
            exit 1
          fi
          echo "Commits waiting to be released:"
          git log --no-merges --format='  %h %s' origin/main..HEAD

      - name: Open the pull request that moves dev into main
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(python3 -c "import json;print(json.load(open('scribe.workspace.json'))['version'])")
          existing=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "Release scribe $version"
            echo "Updated PR #$existing for scribe $version"
            exit 0
          fi

          gh pr create \
            --base main \
            --head dev \
            --title "Release scribe $version" \
            --body "$(printf 'Cut by the release workflow.\n\nVersions and `CHANGELOG.md` are already committed on `dev`. Merging this is what publishes scribe %s to `main`, the branch people clone.\n\nThe changelog entry for this release is at the top of `CHANGELOG.md`.' "$version")"
