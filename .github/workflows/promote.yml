name: promote

on:
  workflow_run:
    workflows: [tests]
    types: [completed]

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  to-main:
    if: >
      vars.DEV_PHASE == 'true'
      && github.event.workflow_run.head_branch == 'dev'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_commit.author.name != 'scribe-release[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Wait for every required check on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          required="engine sdk-js versioning headers protocol format"

          for attempt in $(seq 1 45); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" --paginate \
              --jq '.check_runs[] | .name + ":" + (.conclusion // "pending")')

            waiting=0
            broken=""
            for name in $required; do
              state=$(printf '%s\n' "$runs" | grep "^$name:" | head -1 | cut -d: -f2)
              case "${state:-missing}" in
                success) ;;
                pending | missing) waiting=1 ;;
                *) broken="$broken $name($state)" ;;
              esac
            done

            if [ -n "$broken" ]; then
              echo "Not promoting, these checks did not pass:$broken" >&2
              exit 1
            fi

            if [ "$waiting" -eq 0 ]; then
              echo "Every required check passed on ${SHA}"
              exit 0
            fi

            sleep 20
          done

          echo "Timed out waiting for the checks on ${SHA}" >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_PUSH_KEY }}
          persist-credentials: true

      - name: Refuse to promote a commit that is no longer the tip of dev
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "dev moved on since $SHA, a later run will promote it"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Work out the version and write the changelog
        working-directory: .github/versioning
        run: python3 bump.py --repo="$GITHUB_WORKSPACE" --base=origin/main --head=HEAD

      - name: Commit the versions and changelog when they moved
        run: |
          set -eu
          git config user.name "scribe-release[bot]"
          git config user.email "scribe-release@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "No version moved, promoting the commit as it is"
            exit 0
          fi

          version=$(cat VERSION)
          git commit -m "[RELEASE]: scribe $version"
          git push origin HEAD:dev

      - name: Bring dev into main
        run: |
          set -eu
          git fetch origin main:refs/remotes/origin/main
          tip=$(git rev-parse HEAD)

          if git diff --quiet origin/main..HEAD; then
            echo "main already carries this tree, nothing to promote"
            exit 0
          fi

          git checkout -B promotion origin/main
          git merge --no-edit "$tip"
          git push origin promotion:main

          if [ "$(git rev-parse promotion)" != "$tip" ]; then
            git push origin promotion:dev
            echo "main had diverged, dev realigned onto the merge"
          fi
          echo "main now carries scribe $(cat VERSION) from ${tip}"
