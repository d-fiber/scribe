name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "20 23 * * *"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the packages submodule
        env:
          PACKAGES_READ_KEY: ${{ secrets.PACKAGES_READ_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          printf '%s\n' "$PACKAGES_READ_KEY" > ~/.ssh/packages
          chmod 600 ~/.ssh/packages
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/packages -o IdentitiesOnly=yes" \
            git submodule update --init --recursive

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type check
        run: deno task check

      - name: Lint
        run: deno task lint

      - name: Run tests
        run: deno task test

      - name: Run tests with network access
        run: deno task test:net

  sdk-js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install the npm dependencies
        run: deno install

      - name: Type check
        run: deno task check

      - name: Run tests
        run: deno task test

  headers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check license headers
        run: bash .github/headers/check.sh

  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check the formatting
        run: deno fmt --check

  version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version, and who moved it
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash .github/version/check.sh

      - name: Write the changelog section, if the version moved
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        run: |
          set -eu
          bash .github/version/changelog.sh

          git diff --quiet CHANGELOG.md && exit 0

          version=$(python3 -c "import json;print(json.load(open('deno.json'))['version'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "[DOC]: write what $version is made of"
          git push origin HEAD:dev

      - name: Name this commit after the version, if it has moved
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        run: bash .github/version/tag.sh

  dependencies:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Report the Deno dependencies that moved
        run: |
          set -eu
          {
            echo "## Deno dependencies"
            echo ""
            echo "Dependabot does not read Deno, so this is the only place these show up."
            echo ""
            for root in engine sdk/js; do
              echo "### $root"
              echo ""
              echo '```'
              (cd "$root" && deno outdated 2>&1) || echo "could not read $root"
              echo '```'
              echo ""
            done
            echo "Imports pinned by URL are invisible here too. Today that is"
            echo '`jose`, pinned to a fixed version of deno.land/x in deno.json.'
          } >> "$GITHUB_STEP_SUMMARY"

  protocol:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check out the packages submodule
        env:
          PACKAGES_READ_KEY: ${{ secrets.PACKAGES_READ_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          printf '%s\n' "$PACKAGES_READ_KEY" > ~/.ssh/packages
          chmod 600 ~/.ssh/packages
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/packages -o IdentitiesOnly=yes" \
            git submodule update --init --recursive

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Compile every .proto
        run: |
          set -eu
          cd "$(dirname "$GITHUB_WORKSPACE")"
          root="$(basename "$GITHUB_WORKSPACE")"
          find "$root" -name '*.proto' -path '*/protocol/*' -print0 \
            | xargs -0 protoc -I . --descriptor_set_out=/dev/null
