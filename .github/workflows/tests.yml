name: tests

on:
  push:
    branches: [dev, main]
  pull_request:
  schedule:
    - cron: "20 23 * * *"

permissions:
  contents: read

env:
  DENO_VERSION: 2.7.14
  BUN_VERSION: 1.4.0

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The three checks every repository owes, held here and called by the five.
  checks:
    uses: ./.github/workflows/gate.yml
    with:
      excluded: "node_modules .git .dart_tool __pycache__ gen examples fixtures"

  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('dev_tools/runtime/deno/deno.lock') }}
          restore-keys: deno-${{ runner.os }}-

      # `check`, `check:examples`, `test`, `test:net`, `lint:builtin` and `lint:custom` are all
      # targets declared once in scribe.workspace.json without naming a runtime;
      # dev_tools/runtime/deno/run.sh is what turns a target into deno flags, and is the only
      # place that does.
      - name: Write dev_tools/runtime/{deno,bun} from scribe.workspace.json
        run: bash dev_tools/gen/workspace.sh

      - name: Type check
        run: bash dev_tools/runtime/deno/run.sh check

      - name: Check that documented examples still compile
        run: bash dev_tools/runtime/deno/run.sh check:examples

      - name: Lint
        run: |
          bash dev_tools/runtime/deno/run.sh lint:builtin
          bash dev_tools/runtime/deno/run.sh lint:custom

      - name: Run tests
        run: bash dev_tools/runtime/deno/run.sh test

      - name: Run tests with network access
        run: bash dev_tools/runtime/deno/run.sh test:net

      # Not the whole workspace under bun yet: a couple of packages carry a jsr:-only, Deno-only
      # dependency with no bun-reachable equivalent bound in the import map. What this does prove
      # on every run is that specifier resolution and engine/runtime/scholium/bun/* actually work
      # under a real `bun test`, not only under deno - the gap most likely to go unnoticed if only
      # deno ever ran here.
      - name: Run the resolution probe under bun
        run: bash dev_tools/resolution/run.sh bun

  sdk-js:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdk/js

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Install the npm dependencies
        run: deno install

      - name: Type check
        run: deno task check

      - name: Run tests
        run: deno task test

  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check that no tracked file is a binary
        run: bash .github/binaries/check.sh

  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check that every package is reached through its door
        run: bash .github/packages/check.sh

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Write dev_tools/runtime/{deno,bun} from scribe.workspace.json
        run: bash dev_tools/gen/workspace.sh

      - name: Check the formatting
        run: deno fmt --config dev_tools/runtime/deno/deno.json --check .

  tag:
    needs: [engine, sdk-js, binaries, packages, format, protocol, checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_PUSH_KEY }}
          persist-credentials: true

      - name: Write the changelog section, if the version moved
        run: |
          set -eu
          bash .github/version/changelog.sh

          git diff --quiet CHANGELOG.md && exit 0

          version=$(python3 -c "import json;print(json.load(open('scribe.workspace.json'))['version'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "[DOC]: write what $version is made of"
          git push origin HEAD:dev

      - name: Name this commit after the version, if it has moved
        run: bash .github/version/tag.sh

  dependencies:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Write dev_tools/runtime/{deno,bun} from scribe.workspace.json
        run: bash dev_tools/gen/workspace.sh

      - name: Report the Deno dependencies that moved
        run: |
          set -eu
          {
            echo "## Deno dependencies"
            echo ""
            echo "Dependabot does not read Deno, so this is the only place these show up."
            echo ""
            echo "### engine"
            echo ""
            echo '```'
            deno outdated --config dev_tools/runtime/deno/deno.json --lock dev_tools/runtime/deno/deno.lock 2>&1 || echo "could not read engine"
            echo '```'
            echo ""
            echo "### sdk/js"
            echo ""
            echo '```'
            (cd sdk/js && deno outdated 2>&1) || echo "could not read sdk/js"
            echo '```'
            echo ""
            echo "Imports pinned by URL are invisible here too. Today that is"
            echo '`jose`, pinned to a fixed version of deno.land/x in scribe.workspace.json.'
          } >> "$GITHUB_STEP_SUMMARY"

  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Compile every .proto
        run: |
          set -eu
          cd "$(dirname "$GITHUB_WORKSPACE")"
          root="$(basename "$GITHUB_WORKSPACE")"
          find "$root" -name '*.proto' -path '*/protocol/*' -print0 \
            | xargs -0 protoc -I . --descriptor_set_out=/dev/null
