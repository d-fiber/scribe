name: tests

on:
  push:
    branches: [dev, main]
  pull_request:
  schedule:
    - cron: "20 23 * * *"

permissions:
  contents: read

env:
  DENO_VERSION: 2.7.14

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: deno-${{ runner.os }}-

      - name: Type check
        run: deno task check

      - name: Lint
        run: deno task lint

      - name: Run tests
        run: deno task test

      - name: Run tests with network access
        run: deno task test:net

  sdk-js:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdk/js

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Install the npm dependencies
        run: deno install

      - name: Type check
        run: deno task check

      - name: Run tests
        run: deno task test

  headers:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check license headers
        run: bash .github/headers/check.sh

  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check that no tracked file is a binary
        run: bash .github/binaries/check.sh

  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check that every package is reached through its door
        run: bash .github/packages/check.sh

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Check the formatting
        run: deno fmt --check

  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check the version, and who moved it
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash .github/version/check.sh

  # The only job that writes, and it waits for every job that judges.
  #
  # A tag never moves, so one posted while a check was still running would name a
  # red commit for good, and the only way out of that is to burn the number. The
  # changelog goes out on the deploy key rather than on GITHUB_TOKEN, because a
  # push made with that token starts no workflow and the commit would land on dev
  # without anything ever reading it.
  tag:
    needs: [engine, sdk-js, headers, binaries, packages, format, version, protocol]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_PUSH_KEY }}
          persist-credentials: true

      - name: Write the changelog section, if the version moved
        run: |
          set -eu
          bash .github/version/changelog.sh

          git diff --quiet CHANGELOG.md && exit 0

          version=$(python3 -c "import json;print(json.load(open('deno.json'))['version'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "[DOC]: write what $version is made of"
          git push origin HEAD:dev

      - name: Name this commit after the version, if it has moved
        run: bash .github/version/tag.sh

  dependencies:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Report the Deno dependencies that moved
        run: |
          set -eu
          {
            echo "## Deno dependencies"
            echo ""
            echo "Dependabot does not read Deno, so this is the only place these show up."
            echo ""
            for root in engine sdk/js; do
              echo "### $root"
              echo ""
              echo '```'
              (cd "$root" && deno outdated 2>&1) || echo "could not read $root"
              echo '```'
              echo ""
            done
            echo "Imports pinned by URL are invisible here too. Today that is"
            echo '`jose`, pinned to a fixed version of deno.land/x in deno.json.'
          } >> "$GITHUB_STEP_SUMMARY"

  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Compile every .proto
        run: |
          set -eu
          cd "$(dirname "$GITHUB_WORKSPACE")"
          root="$(basename "$GITHUB_WORKSPACE")"
          find "$root" -name '*.proto' -path '*/protocol/*' -print0 \
            | xargs -0 protoc -I . --descriptor_set_out=/dev/null
